[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventar-lowfreq-core"
version = "0.1.0"
description = "Pure Python low-frequency event-driven backtesting framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "eventar contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
	"numpy>=2.0",
	"pandas>=2.2",
	"pyarrow>=16.0",
	"pyperf>=2.7",
	"pytest>=8.0",
	"pytest-benchmark>=4.0",
	"ruff>=0.5",
	"mypy>=1.10",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
	"unit: fast unit tests",
	"integration: integration tests",
	"e2e: end-to-end tests",
	"slow: long running tests",
	"perf: performance benchmarks",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
